[package]
name = "vmq_mvp"
version = "0.6.0"
authors = ["Trong-Nghia Be <benghia1st@gmail.com> & Vũ Mạnh Quân <taladinhcao@gmail.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
base64 = "0.22.1"
dioxus = { version = "0.7.2", features = ["router", "fullstack"] }
# Pure Rust DOCX writer (zip + quick-xml); `image` stays off so it builds for wasm.
docx-rs = { version = "0.4.22", default-features = false }
futures-util = "0.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.17"
tracing = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.19.0", features = ["v4", "serde", "js"] }
gloo-timers = "0.3"
gloo-net = "0.6"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement"] }
js-sys = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
uuid = { version = "1.19.0", features = ["v4", "serde"] }
tokio = { version = "1.48.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
dotenvy = "0.15"
once_cell = "1.20"
sqlx = { version = "0.8.2", features = ["sqlite", "runtime-tokio", "tls-native-tls"] }
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["fs"] }
tempfile = "3"
open = "5"

[dev-dependencies]
tempfile = "3"

[features]
default = ["web"]
# The feature that are only required for the web = ["dioxus/web"] build target should be optional and only enabled in the web = ["dioxus/web"] feature
web = ["dioxus/web"]
# The feature that are only required for the desktop = ["dioxus/desktop"] build target should be optional and only enabled in the desktop = ["dioxus/desktop"] feature
desktop = ["dioxus/desktop"]
# The feature that are only required for the mobile = ["dioxus/mobile"] build target should be optional and only enabled in the mobile = ["dioxus/mobile"] feature
mobile = ["dioxus/mobile"]
# The feature that are only required for the server = ["dioxus/server"] build target should be optional and only enabled in the server = ["dioxus/server"] feature
server = ["dioxus/server"]

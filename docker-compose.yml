services:
  listening-generator:
    build:
      context: .
      dockerfile: Dockerfile
    image: listening-generator:latest
    container_name: listening-generator
    restart: unless-stopped
    ports:
      # Bind to localhost; put Caddy/nginx with TLS and auth in front.
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      - IP=0.0.0.0
      - PORT=8080
      - DATA_DIR=/app/data
    volumes:
      - generator_data:/app/data

volumes:
  generator_data:
